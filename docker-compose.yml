services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: assisty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assisty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assisty}
      POSTGRES_DB: ${POSTGRES_DB:-assisty}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assisty} -d ${POSTGRES_DB:-assisty}"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: assisty-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    ports:
      - "4000:4000"

  api:
    build:
      context: ./backend
      target: dev
    container_name: assisty-api
    restart: unless-stopped
    command: ["npm", "run", "start:dev"]
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started

volumes:
  pgdata:
